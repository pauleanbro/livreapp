<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="-2 -2 36 36"
  width="300"
  height="300"
>
  <style>
    .logo-path {
      fill: rgba(58, 204, 144, 0);
      stroke: #3ACC90;
      stroke-width: 0.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      /* 
        1) Desenha o traço em 4s
        2) Começa a preencher aos 2s
        (nenhuma animação após isso)
      */
      animation:
        draw 4s ease forwards,
        fillGradual 1s ease-in 2s forwards;
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes fillGradual {
      0% {
        fill: rgba(58, 204, 144, 0);
      }
      100% {
        fill: rgba(58, 204, 144, 1);
      }
    }
  </style>

